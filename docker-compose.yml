services:
  web:
    build: .
    env_file: .env.production
    # Vertex AI auth (ADC): service-account key with the Vertex AI User role, kept out of git.
    environment: { GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json }
    volumes: ["./gcp-sa.json:/run/secrets/gcp-sa.json:ro"]
    restart: unless-stopped
    expose: ["3000"]
    deploy: { replicas: 4 }
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data", "caddy_config:/config"]
    restart: unless-stopped
volumes: { caddy_data: {}, caddy_config: {} }
