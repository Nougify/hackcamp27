services:
  web:
    build: .
    env_file: .env.production
    restart: unless-stopped
    expose: ["3000"]
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data", "caddy_config:/config"]
    restart: unless-stopped
volumes: { caddy_data: {}, caddy_config: {} }
